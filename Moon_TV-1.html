<!doctype html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#141414">
  <title>Moon TV - Movie & Series Platform</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAIAAAB7GkOtAAAV7klEQVR4nO3dvY4r15UG0LqCJODCEjCxEwfzEIr8BHbgyA850QQzT6BIDzGBk4kFCEqsQA5otCiyyS5WnZ999l4rujDaVFWx+H3np5r96fPnbzYA6vli9gEAMIcCAChKAQAUpQAAilIAAEUpAICiFABAUQoAoCgFAFCUAgAoSgEAFPXl7AOA7j4d/T/+2vIoIBwFwKoOx3qP/4SqYEUKgDUMiPsz7g9PIPRCfAICW4getRadius">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { netflixRed: '#E50914', darkBg: '#141414', cardBg: '#181818', accentGray: '#2F2F2F' } } } }
  </script>
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #141414; color: white; margin: 0; padding: 0; }
    .movie-card { transition: transform 0.2s ease-in-out; }
    .movie-card:hover { transform: translateY(-4px); }
    .movie-card:active { transform: scale(0.98); }
    .backdrop-gradient { background: linear-gradient(180deg, transparent 0%, rgba(20,20,20,0.75) 60%, #141414 100%); }
    button, input, select { font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #141414; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #E50914; }
  </style>
</head>
<body class="bg-[#141414] text-white antialiased selection:bg-red-600 selection:text-white">
  <div id="sideBannerAd" class="fixed bottom-4 left-4 z-50 flex flex-col items-end transition-all duration-300">
    <div class="bg-zinc-900/95 border border-zinc-700/80 rounded-xl shadow-2xl p-2 relative backdrop-blur-md">
      <button onclick="document.getElementById('sideBannerAd').remove()" class="absolute -top-3 -right-3 bg-red-600 hover:bg-red-700 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shadow-lg border border-zinc-900 transition active:scale-90" title="Close Ad"><i class="fa-solid fa-xmark"></i></button>
      <div class="text-[10px] text-zinc-500 mb-1 px-1 font-semibold text-left">Sponsored</div>
      <div class="overflow-hidden rounded-lg bg-black/50 flex items-center justify-center min-w-[300px] min-h-[250px]">
        <script>var atOptions = {'key':'4b5f8a1de9e8434df0d0f68d1b01abdc','format':'iframe','height':250,'width':300,'params':{}};</script>
        <script src="https://bancadeltempoidea.org/22/4b5f8a1de9e8434df0d0f68d1b01abdc"></script>
      </div>
    </div>
  </div>
  <header class="fixed top-0 left-0 right-0 z-40 bg-black/90 backdrop-blur-md border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 text-2xl font-black text-netflixRed cursor-pointer" onclick="loadTrending('all')">
        <span class="inline-flex items-center justify-center rounded-lg bg-red-600 text-white w-9 h-9 shadow-lg shadow-red-600/30">M</span><span>Moon <b class="text-white">TV</b></span>
      </div>
      <button onclick="document.getElementById('search').focus()" class="text-xl p-2 text-gray-300 hover:text-white transition"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div class="max-w-7xl mx-auto px-4 pb-3"><div class="relative">
      <input id="search" oninput="searchMedia(this.value)" placeholder="Search for a movie or TV series..." class="w-full bg-zinc-900/90 border border-zinc-700/80 rounded-full py-2 pr-4 pl-10 text-sm outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition">
      <i class="fa-solid fa-search absolute left-3.5 top-3 text-zinc-500 text-xs"></i>
    </div></div>
    <nav class="flex justify-around max-w-7xl mx-auto pb-3 text-sm font-semibold border-t border-zinc-800/50 pt-2">
      <button onclick="setActiveNav(this); loadTrending('all')" class="nav-btn text-red-500 hover:text-red-500 transition">Home</button>
      <button onclick="setActiveNav(this); loadTrending('tv')" class="nav-btn text-gray-400 hover:text-white transition">TV Series</button>
      <button onclick="setActiveNav(this); loadTrending('movie')" class="nav-btn text-gray-400 hover:text-white transition">Movies</button>
    </nav>
  </header>
  <main class="pt-40 pb-12 px-4 max-w-7xl mx-auto">
    <section id="hero" class="hidden relative h-80 sm:h-96 rounded-2xl overflow-hidden mb-8 bg-zinc-900 border border-zinc-800 shadow-2xl">
      <div id="heroBg" class="absolute inset-0 bg-cover bg-center transition-all duration-500"></div><div class="absolute inset-0 backdrop-gradient"></div>
      <div class="absolute bottom-0 p-6 max-w-2xl">
        <span class="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-bold shadow-md inline-block mb-2"><i class="fa-solid fa-fire text-yellow-300 mr-1"></i> Trending Now</span>
        <h1 id="heroTitle" class="font-black text-2xl sm:text-4xl my-2 leading-tight drop-shadow-md"></h1>
        <p id="heroDesc" class="text-gray-300 text-xs sm:text-sm line-clamp-2 mb-4 leading-relaxed"></p>
        <button id="heroPlay" class="bg-red-600 hover:bg-red-700 text-white rounded-xl px-6 py-2.5 font-bold text-sm shadow-lg shadow-red-600/30 flex items-center gap-2 transition active:scale-95"><i class="fa-solid fa-play"></i> Watch Now</button>
      </div>
    </section>
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-zinc-800 pb-3 mb-6 gap-3">
      <h2 id="heading" class="font-bold text-lg sm:text-xl flex items-center gap-2"><i class="fa-solid fa-fire text-red-600"></i> Latest Trending Releases</h2>
      <div class="flex gap-2 text-xs font-semibold">
        <button id="btn-filter-all" class="filter-btn bg-red-600 text-white px-3.5 py-1.5 rounded-lg transition" onclick="filterType('all')">All</button>
        <button id="btn-filter-tv" class="filter-btn bg-zinc-800 text-gray-300 hover:bg-zinc-700 px-3.5 py-1.5 rounded-lg transition" onclick="filterType('tv')">TV Series</button>
        <button id="btn-filter-movie" class="filter-btn bg-zinc-800 text-gray-300 hover:bg-zinc-700 px-3.5 py-1.5 rounded-lg transition" onclick="filterType('movie')">Movies</button>
      </div>
    </div>
    <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"><p class="col-span-full text-center text-gray-400 p-12 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading content...</p></div>
  </main>
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/95 p-3 flex items-center justify-center backdrop-blur-sm transition-opacity duration-300">
    <div class="w-full max-w-4xl bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 shadow-2xl flex flex-col">
      <div class="p-4 bg-zinc-950 flex items-center justify-between border-b border-zinc-800"><b id="modalTitle" class="text-base sm:text-lg font-bold text-white truncate pr-2"></b><button onclick="closePlayer()" class="text-gray-400 hover:text-white text-2xl w-8 h-8 rounded-full hover:bg-zinc-800 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button></div>
      <div id="tvControls" class="hidden p-3 bg-zinc-900 border-b border-zinc-800 flex flex-wrap gap-3 text-xs sm:text-sm">
        <label class="flex items-center gap-2 bg-zinc-950 px-3 py-1.5 rounded-lg border border-zinc-800"><span class="text-gray-400 font-semibold">Season:</span><select id="season" onchange="updateEpisodes()" class="bg-transparent text-white outline-none font-bold cursor-pointer"></select></label>
        <label class="flex items-center gap-2 bg-zinc-950 px-3 py-1.5 rounded-lg border border-zinc-800 flex-1 min-w-[180px]"><span class="text-gray-400 font-semibold">Episode:</span><select id="episode" onchange="updateVideoSource()" class="bg-transparent text-white outline-none font-bold cursor-pointer w-full"></select></label>
      </div>
      <div class="aspect-video bg-black relative"><div id="clickShield" onclick="removeShield()" class="absolute inset-0 z-20 bg-transparent cursor-pointer" title="Click to start"></div><iframe id="player" class="w-full h-full border-0 relative z-10" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe></div>
      <div class="p-3 bg-zinc-950 border-t border-zinc-800 flex items-center justify-between flex-wrap gap-2 text-xs"><span class="text-gray-400"><i class="fa-solid fa-server mr-1 text-red-500"></i> Streaming Server:</span><div class="flex gap-2"><button id="srv-vidsrc" onclick="switchServer('vidsrc')" class="bg-red-600 text-white rounded-lg px-3 py-1.5 font-bold transition">Server 1</button><button id="srv-2embed" onclick="switchServer('2embed')" class="bg-zinc-800 hover:bg-zinc-700 text-gray-300 rounded-lg px-3 py-1.5 font-bold transition">Server 2</button></div></div>
    </div>
  </div>
  <footer class="text-center text-xs text-gray-500 py-8 border-t border-zinc-900 bg-zinc-950"><p class="mb-1">All Rights Reserved © Moon TV</p><p class="text-gray-600">Cinema data provided by TMDB API</p></footer>
<script>
const KEY='3fd2be6f0c70a2a598f084ddfb75487c', API='https://api.themoviedb.org/3', IMG='https://image.tmdb.org/t/p/w500', BACK='https://image.tmdb.org/t/p/original';
let list=[], item=null, server='vidsrc', filter='all', searchTimer;
async function request(path){let r=await fetch(API+path+(path.includes('?')?'&':'?')+'api_key='+KEY+'&language=en-US');if(!r.ok)throw Error('network');return r.json()}
function typeOf(x){return x.media_type||(x.title?'movie':'tv')}
function titleOf(x){return x.title||x.name||'Untitled'}
function setActiveNav(btn){document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('text-red-500');b.classList.add('text-gray-400')});btn.classList.remove('text-gray-400');btn.classList.add('text-red-500')}
async function loadTrending(type='all'){
 filter=type;document.getElementById('heading').innerHTML='<i class="fa-solid fa-fire text-red-600"></i> Latest Trending Releases';document.getElementById('grid').innerHTML='<p class="col-span-full text-center p-12 text-gray-400 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading...</p>';
 try{let d=await request('/trending/'+(type==='all'?'all':type)+'/day');list=(d.results||[]).filter(x=>x.media_type!=='person');render(list);if(list.length&&type==='all')hero(list[0]);else document.getElementById('hero').classList.add('hidden')}
 catch(e){document.getElementById('grid').innerHTML='<p class="col-span-full text-center text-red-400 p-8 text-sm"><i class="fa-solid fa-triangle-exclamation mr-2"></i> Failed to load. Check your internet connection.</p>'}
}
function hero(x){let h=document.getElementById('hero');h.classList.remove('hidden');document.getElementById('heroBg').style.backgroundImage=x.backdrop_path?`url(${BACK+x.backdrop_path})`:'';document.getElementById('heroTitle').textContent=titleOf(x);document.getElementById('heroDesc').textContent=x.overview||'No description available for this cinematic work.';document.getElementById('heroPlay').onclick=()=>openPlayer(x)}
function render(items){
 let g=document.getElementById('grid');g.innerHTML='';if(!items.length){g.innerHTML='<p class="col-span-full text-center text-gray-400 p-12 text-sm"><i class="fa-solid fa-box-open mr-2"></i> No matching results.</p>';return}
 items.forEach(x=>{let t=typeOf(x),el=document.createElement('button');el.className='movie-card text-left bg-cardBg rounded-xl overflow-hidden border border-zinc-800/80 shadow-md flex flex-col justify-between group';let poster=x.poster_path?IMG+x.poster_path:'https://placehold.co/500x750/181818/888?text=Moon+TV';
 el.innerHTML=`<div class="relative aspect-[2/3] w-full overflow-hidden bg-zinc-900"><img src="${poster}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${escapeHTML(titleOf(x))}"><span class="absolute top-2 left-2 bg-black/80 backdrop-blur-sm text-yellow-400 rounded-md px-2 py-0.5 text-xs font-bold flex items-center gap-1 shadow"><i class="fa-solid fa-star text-[10px]"></i> ${x.vote_average?x.vote_average.toFixed(1):'—'}</span><span class="absolute top-2 right-2 bg-red-600 text-white font-semibold rounded-md px-2 py-0.5 text-[10px] shadow">${t==='tv'?'TV Series':'Movie'}</span></div><div class="p-3 w-full bg-zinc-900/60"><div class="font-bold text-xs sm:text-sm truncate text-white group-hover:text-red-500 transition">${escapeHTML(titleOf(x))}</div><div class="flex justify-between items-center text-[11px] text-gray-400 mt-2"><span>${(x.release_date||x.first_air_date||'').slice(0,4)||'—'}</span><span class="text-red-500 font-bold flex items-center gap-1">Watch <i class="fa-solid fa-play text-[9px]"></i></span></div></div>`;
 el.onclick=()=>openPlayer(x);g.appendChild(el)})
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filterType(t){filter=t;document.querySelectorAll('.filter-btn').forEach(b=>{b.classList.remove('bg-red-600','text-white');b.classList.add('bg-zinc-800','text-gray-300')});let activeBtn=document.getElementById('btn-filter-'+t);if(activeBtn){activeBtn.classList.remove('bg-zinc-800','text-gray-300');activeBtn.classList.add('bg-red-600','text-white')}render(t==='all'?list:list.filter(x=>typeOf(x)===t))}
function searchMedia(q){clearTimeout(searchTimer);if(q.trim().length<2){if(!q.trim())loadTrending();return}searchTimer=setTimeout(async()=>{try{let d=await request('/search/multi?query='+encodeURIComponent(q.trim()));list=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv');document.getElementById('heading').innerHTML='<i class="fa-solid fa-search text-red-600"></i> Search Results';render(list)}catch(e){}},350)}
async function openPlayer(x){
 item={id:x.id,type:typeOf(x),title:titleOf(x)};document.getElementById('modalTitle').textContent=item.title;document.getElementById('modal').classList.remove('hidden');document.body.style.overflow='hidden';resetShield();
 if(item.type==='tv'){document.getElementById('tvControls').classList.remove('hidden');try{let d=await request('/tv/'+item.id);let s=document.getElementById('season');s.innerHTML='';(d.seasons||[]).filter(a=>a.season_number>0).forEach(a=>s.add(new Option('Season '+a.season_number,a.season_number)));await updateEpisodes()}catch(e){updateVideoSource()}}
 else{document.getElementById('tvControls').classList.add('hidden');updateVideoSource()}
}
async function updateEpisodes(){if(!item)return;let sn=document.getElementById('season').value||1;try{let d=await request('/tv/'+item.id+'/season/'+sn);let e=document.getElementById('episode');e.innerHTML='';(d.episodes||[]).forEach(a=>e.add(new Option('Episode '+a.episode_number+' - '+(a.name||'Untitled'),a.episode_number)))}catch(err){}updateVideoSource()}
function updateVideoSource(){if(!item)return;resetShield();let url;if(item.type==='movie'){url=server==='vidsrc'?`https://vidsrc.to/embed/movie/${item.id}`:`https://www.2embed.cc/embed/${item.id}`}else{let s=document.getElementById('season').value||1,e=document.getElementById('episode').value||1;url=server==='vidsrc'?`https://vidsrc.to/embed/tv/${item.id}/${s}/${e}`:`https://www.2embed.cc/embedtv/${item.id}&s=${s}&e=${e}`}document.getElementById('player').src=url}
function switchServer(s){server=s;const b1=document.getElementById('srv-vidsrc'),b2=document.getElementById('srv-2embed');if(s==='vidsrc'){b1.className='bg-red-600 text-white rounded-lg px-3 py-1.5 font-bold transition';b2.className='bg-zinc-800 hover:bg-zinc-700 text-gray-300 rounded-lg px-3 py-1.5 font-bold transition'}else{b2.className='bg-red-600 text-white rounded-lg px-3 py-1.5 font-bold transition';b1.className='bg-zinc-800 hover:bg-zinc-700 text-gray-300 rounded-lg px-3 py-1.5 font-bold transition'}updateVideoSource()}
function closePlayer(){document.getElementById('player').src='';document.getElementById('modal').classList.add('hidden');document.body.style.overflow='auto'}
function removeShield(){let s=document.getElementById('clickShield');if(s)s.style.display='none'}
function resetShield(){let s=document.getElementById('clickShield');if(s)s.style.display='block'}
loadTrending();
</script>
</body>
</html>
